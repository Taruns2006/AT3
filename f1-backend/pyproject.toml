[tool.ruff]
target-version = "py311"
line-length = 100
src = ["f1-backend"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
]
ignore = [
    "E501",  # line too long — handled by line-length above
    "B008",  # do not perform function calls in default args (FastAPI Depends pattern)
    "N806",  # variable in function should be lowercase (allow DataFrame 'X')
    "E402",  # module level import not at top of file (sys.path injection)
    "W293",  # blank line contains whitespace
]

[tool.ruff.lint.isort]
known-first-party = ["simulator", "pipeline", "ingestion", "ml", "api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "cassandra: tests requiring a live Cassandra instance (skip if unreachable)",
]
addopts = "-v --tb=short"
