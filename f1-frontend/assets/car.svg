<?xml version="1.0" encoding="UTF-8"?>
<!--
  F1 Telemetry — Hero Car Illustration
  An original, top-down view of a Formula 1 car in orange/black livery.
  This is a purely geometric/artistic SVG and does not reproduce any
  real team's car. It is fully original creative work.

  SWAPPING YOUR OWN IMAGE:
  Replace this file at assets/car.svg or change the src on the
  <img id="hero-car-img"> element in index.html.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 280" fill="none" role="img" aria-label="Formula 1 race car illustration, top view">
  <defs>
    <!-- Main body gradient: orange/charcoal -->
    <linearGradient id="body-grad" x1="240" y1="0" x2="240" y2="280" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FF5A1F"/>
      <stop offset="35%" stop-color="#CC3A0A"/>
      <stop offset="70%" stop-color="#1a1a1c"/>
      <stop offset="100%" stop-color="#0e0e0f"/>
    </linearGradient>
    <!-- Cockpit glass -->
    <linearGradient id="cockpit-grad" x1="240" y1="80" x2="240" y2="160" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1a3a4a" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0a1820" stop-opacity="0.7"/>
    </linearGradient>
    <!-- Wing gradient -->
    <linearGradient id="wing-grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FF5A1F" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#FF3D00"/>
      <stop offset="100%" stop-color="#FF5A1F" stop-opacity="0.8"/>
    </linearGradient>
    <!-- Tire gradient -->
    <radialGradient id="tire-grad" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#3a3a3c"/>
      <stop offset="100%" stop-color="#111113"/>
    </radialGradient>
    <!-- Glow filter -->
    <filter id="car-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <!-- Orange glow -->
    <filter id="orange-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feFlood flood-color="#FF5A1F" flood-opacity="0.4" result="color"/>
      <feComposite in="color" in2="blur" operator="in" result="colored-blur"/>
      <feMerge>
        <feMergeNode in="colored-blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="soft-shadow">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- ─── BACKGROUND GLOW ──────────────────────────────── -->
  <ellipse cx="240" cy="180" rx="180" ry="60" fill="rgba(255,90,31,0.08)" filter="url(#orange-glow)"/>

  <!-- ─── FRONT WING ────────────────────────────────────── -->
  <!-- Main wing plane -->
  <path d="M 100 24 Q 130 20 160 22 L 165 34 Q 150 36 130 37 Q 110 36 95 34 Z"
        fill="url(#wing-grad)" filter="url(#soft-shadow)"/>
  <path d="M 320 24 Q 350 20 380 24 L 385 34 Q 370 36 350 37 Q 330 36 315 34 Z"
        fill="url(#wing-grad)" filter="url(#soft-shadow)"/>
  <!-- Wing endplates -->
  <rect x="96" y="20" width="6" height="18" rx="1" fill="#1a1a1c"/>
  <rect x="378" y="20" width="6" height="18" rx="1" fill="#1a1a1c"/>
  <!-- Nose tip -->
  <path d="M 190 20 L 240 6 L 290 20 L 285 30 Q 240 22 195 30 Z"
        fill="#CC3A0A" filter="url(#soft-shadow)"/>
  <!-- Wing struts -->
  <line x1="160" y1="26" x2="195" y2="26" stroke="#FF5A1F" stroke-width="1.5" stroke-opacity="0.7"/>
  <line x1="320" y1="26" x2="285" y2="26" stroke="#FF5A1F" stroke-width="1.5" stroke-opacity="0.7"/>

  <!-- ─── MAIN BODY ──────────────────────────────────────── -->
  <path d="M 195 26
           Q 200 24 240 22 Q 280 24 285 26
           L 300 50  Q 310 70 315 100
           L 320 160 Q 315 200 305 220
           L 295 240 Q 270 255 240 258 Q 210 255 185 240
           L 175 220 Q 165 200 160 160
           L 165 100 Q 170 70 180 50 Z"
        fill="url(#body-grad)" filter="url(#soft-shadow)"/>

  <!-- Body highlight stripe -->
  <path d="M 230 30 L 228 240 M 250 30 L 252 240"
        stroke="rgba(255,255,255,0.06)" stroke-width="1"/>

  <!-- Orange livery side stripe left -->
  <path d="M 196 60 Q 180 80 172 110 L 170 130 Q 175 125 185 122 Q 185 100 196 80 Z"
        fill="#FF5A1F" fill-opacity="0.7"/>
  <!-- Orange livery side stripe right -->
  <path d="M 284 60 Q 300 80 308 110 L 310 130 Q 305 125 295 122 Q 295 100 284 80 Z"
        fill="#FF5A1F" fill-opacity="0.7"/>

  <!-- ─── COCKPIT + HALO ────────────────────────────────── -->
  <!-- Cockpit opening (carbon frame) -->
  <path d="M 210 75 Q 240 68 270 75 L 272 130 Q 240 136 208 130 Z"
        fill="url(#cockpit-grad)" stroke="rgba(255,90,31,0.3)" stroke-width="1"/>

  <!-- Halo safety structure -->
  <path d="M 215 78 Q 240 70 265 78" stroke="#CC3A0A" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M 238 72 L 236 95" stroke="#CC3A0A" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Driver helmet (simplified oval) -->
  <ellipse cx="240" cy="112" rx="18" ry="14"
           fill="#1a1a1c" stroke="rgba(255,90,31,0.5)" stroke-width="1.5"/>
  <ellipse cx="240" cy="108" rx="11" ry="7"
           fill="#1a3a50" fill-opacity="0.8"/>
  <!-- Visor -->
  <path d="M 229 108 Q 240 103 251 108" stroke="#00BFFF" stroke-width="1.5" fill="none" stroke-opacity="0.6"/>

  <!-- ─── SIDEPODS ────────────────────────────────────────── -->
  <!-- Left sidepod -->
  <path d="M 172 95 Q 165 100 160 120 L 160 190 Q 165 200 175 202
           L 180 202 Q 172 195 170 175 L 170 125 Q 175 108 182 100 Z"
        fill="#1e1e20" stroke="rgba(255,90,31,0.2)" stroke-width="1"/>
  <!-- Left sidepod air intake -->
  <path d="M 170 100 Q 165 108 164 120 L 168 120 Q 169 110 174 103 Z"
        fill="#FF5A1F" fill-opacity="0.5"/>

  <!-- Right sidepod -->
  <path d="M 308 95 Q 315 100 320 120 L 320 190 Q 315 200 305 202
           L 300 202 Q 308 195 310 175 L 310 125 Q 305 108 298 100 Z"
        fill="#1e1e20" stroke="rgba(255,90,31,0.2)" stroke-width="1"/>
  <!-- Right sidepod air intake -->
  <path d="M 310 100 Q 315 108 316 120 L 312 120 Q 311 110 306 103 Z"
        fill="#FF5A1F" fill-opacity="0.5"/>

  <!-- ─── REAR WING ──────────────────────────────────────── -->
  <!-- Main plane -->
  <path d="M 130 230 L 135 242 Q 170 248 240 250 Q 310 248 345 242 L 350 230
           Q 310 224 240 222 Q 170 224 130 230 Z"
        fill="#CC3A0A"/>
  <!-- DRS slot suggestion -->
  <path d="M 150 232 Q 240 229 330 232" stroke="rgba(0,0,0,0.4)" stroke-width="1.5" fill="none"/>
  <!-- Wing endplates -->
  <rect x="126" y="226" width="10" height="22" rx="2" fill="#1a1a1c"/>
  <rect x="344" y="226" width="10" height="22" rx="2" fill="#1a1a1c"/>
  <!-- Beam wing below -->
  <path d="M 200 244 Q 240 246 280 244" stroke="#FF5A1F" stroke-width="2" fill="none" stroke-linecap="round"/>

  <!-- ─── DIFFUSER + EXHAUST ─────────────────────────────── -->
  <path d="M 200 248 Q 240 252 280 248 L 280 255 Q 240 258 200 255 Z"
        fill="#111113" stroke="rgba(255,90,31,0.15)" stroke-width="1"/>
  <!-- Exhaust hint -->
  <ellipse cx="226" cy="248" rx="5" ry="3" fill="rgba(255,90,31,0.25)"/>
  <ellipse cx="254" cy="248" rx="5" ry="3" fill="rgba(255,90,31,0.25)"/>

  <!-- ─── WHEELS / TIRES ─────────────────────────────────── -->
  <!-- Front-left -->
  <ellipse cx="148" cy="62" rx="22" ry="14" fill="url(#tire-grad)"/>
  <ellipse cx="148" cy="62" rx="14" ry="9" fill="#222224" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <ellipse cx="148" cy="62" rx="7" ry="5" fill="#1a1a1c"/>
  <!-- Front-right -->
  <ellipse cx="332" cy="62" rx="22" ry="14" fill="url(#tire-grad)"/>
  <ellipse cx="332" cy="62" rx="14" ry="9" fill="#222224" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <ellipse cx="332" cy="62" rx="7" ry="5" fill="#1a1a1c"/>
  <!-- Rear-left -->
  <ellipse cx="136" cy="196" rx="28" ry="18" fill="url(#tire-grad)"/>
  <ellipse cx="136" cy="196" rx="18" ry="11" fill="#222224" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <ellipse cx="136" cy="196" rx="8" ry="6" fill="#1a1a1c"/>
  <!-- Rear-right -->
  <ellipse cx="344" cy="196" rx="28" ry="18" fill="url(#tire-grad)"/>
  <ellipse cx="344" cy="196" rx="18" ry="11" fill="#222224" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <ellipse cx="344" cy="196" rx="8" ry="6" fill="#1a1a1c"/>

  <!-- Wheel suspension arms (wishbones) -->
  <!-- Front-left -->
  <line x1="162" y1="58" x2="193" y2="56" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>
  <line x1="162" y1="66" x2="193" y2="68" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <!-- Front-right -->
  <line x1="318" y1="58" x2="287" y2="56" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>
  <line x1="318" y1="66" x2="287" y2="68" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <!-- Rear-left -->
  <line x1="158" y1="192" x2="175" y2="180" stroke="rgba(255,255,255,0.10)" stroke-width="1.5"/>
  <line x1="158" y1="200" x2="175" y2="210" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <!-- Rear-right -->
  <line x1="322" y1="192" x2="305" y2="180" stroke="rgba(255,255,255,0.10)" stroke-width="1.5"/>
  <line x1="322" y1="200" x2="305" y2="210" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>

  <!-- ─── CHASSIS DETAILS / CARBON WEAVE HINT ────────────── -->
  <!-- Centre line detail -->
  <line x1="240" y1="35" x2="240" y2="215" stroke="rgba(255,255,255,0.04)" stroke-width="1" stroke-dasharray="4 6"/>
  <!-- Orange centre line accent -->
  <line x1="240" y1="50" x2="240" y2="130" stroke="rgba(255,90,31,0.25)" stroke-width="0.75"/>

  <!-- Sensor pod / mirror stubs -->
  <rect x="205" y="90" width="10" height="5" rx="2" fill="#2a2a2c"/>
  <rect x="265" y="90" width="10" height="5" rx="2" fill="#2a2a2c"/>

  <!-- ─── FLOOR / GROUND EFFECT SKIRTS ──────────────────── -->
  <path d="M 175 145 L 168 145 L 166 200 L 175 200" stroke="rgba(255,90,31,0.20)" stroke-width="1" fill="rgba(0,0,0,0.2)"/>
  <path d="M 305 145 L 312 145 L 314 200 L 305 200" stroke="rgba(255,90,31,0.20)" stroke-width="1" fill="rgba(0,0,0,0.2)"/>

  <!-- ─── DATA TELEMETRY GLOW LINES (decorative) ────────── -->
  <!-- These suggest live sensor data streaming from the car -->
  <g opacity="0.35">
    <line x1="100" y1="62" x2="60" y2="50" stroke="#FF5A1F" stroke-width="0.75" stroke-dasharray="3 5"/>
    <line x1="380" y1="62" x2="420" y2="50" stroke="#FF5A1F" stroke-width="0.75" stroke-dasharray="3 5"/>
    <line x1="130" y1="196" x2="80" y2="210" stroke="#00BFFF" stroke-width="0.75" stroke-dasharray="3 5"/>
    <line x1="350" y1="196" x2="400" y2="210" stroke="#00BFFF" stroke-width="0.75" stroke-dasharray="3 5"/>
    <!-- Telemetry dots -->
    <circle cx="56" cy="49" r="2.5" fill="#FF5A1F"/>
    <circle cx="424" cy="49" r="2.5" fill="#FF5A1F"/>
    <circle cx="76" cy="211" r="2.5" fill="#00BFFF"/>
    <circle cx="404" cy="211" r="2.5" fill="#00BFFF"/>
  </g>
</svg>
